name: Build decor mobileconfig

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Store dùng để tìm app (vn, us, jp...)"
        required: true
        default: "vn"
      use_base:
        description: "Nối thêm vào decor.xml có sẵn trong repo"
        type: boolean
        default: true
      fallback:
        description: "Store dự phòng nếu app không có ở store chính (để trống để tắt)"
        required: false
        default: "us"
      icon_size:
        description: "Cạnh icon: 180 là đủ nét cho iPhone và nhẹ nhất (512 làm file rất nặng)"
        required: true
        default: "180"
      icon_format:
        description: "Định dạng icon (jpg nhẹ hơn png nhiều)"
        type: choice
        options:
          - jpg
          - png
        default: "jpg"
      replace_existing:
        description: "Thay payload cũ trùng nhãn thay vì bỏ qua"
        type: boolean
        default: false
      output_name:
        description: "Tên file đầu ra"
        required: true
        default: "decor.mobileconfig"
      commit_result:
        description: "Commit file kết quả vào repo"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate mobileconfig
        env:
          COUNTRY: ${{ inputs.country }}
          FALLBACK: ${{ inputs.fallback }}
          ICON_SIZE: ${{ inputs.icon_size }}
          ICON_FORMAT: ${{ inputs.icon_format }}
          REPLACE: ${{ inputs.replace_existing }}
          USE_BASE: ${{ inputs.use_base }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          ARGS=(apps.txt --country "$COUNTRY" --fallback "$FALLBACK" --size "$ICON_SIZE" --fmt "$ICON_FORMAT" -o "$OUTPUT_NAME")
          if [ "$REPLACE" = "true" ]; then
            ARGS+=(--replace)
          fi
          if [ "$USE_BASE" = "true" ] && [ -f decor.xml ]; then
            ARGS+=(--base decor.xml)
          fi
          python3 make_decor.py "${ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decor-mobileconfig
          path: |
            ${{ inputs.output_name }}
            apps_report.txt
          if-no-files-found: error

      - name: Commit result
        if: ${{ inputs.commit_result }}
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_NAME"
          git diff --cached --quiet || git commit -m "Update $OUTPUT_NAME"
          git push
